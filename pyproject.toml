[project]
name = "datapilot"
version = "1.1.1"
description = "A durable data-analysis agent backend built with LangGraph and MCP."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "duckdb>=1.4,<2",
  "fastapi>=0.120,<1",
  "langchain-openai>=0.3,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "mcp>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<4",
  "plotly>=6.3,<7",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "sqlglot>=27,<30",
  "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
datapilot = "datapilot.api.app:run"
datapilot-check = "datapilot.quality:main"
datapilot-mcp = "datapilot.mcp_server:run"
datapilot-demo = "datapilot.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilot"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "basic"

